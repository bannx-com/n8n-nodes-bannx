# Stages a release on npm on every version tag push. A maintainer then
# approves it on npmjs.com (or with `npm stage approve <id>`) with 2FA, and only
# then does it go public.
#
# - Auth: npm Trusted Publishing (OIDC) for this repo and this workflow file,
#   set to stage-only. No npm token is stored in the repository.
# - Provenance: n8n requires community nodes to be published from GitHub
#   Actions with an npm provenance statement; --provenance adds it.
# - `npm stage publish` needs npm >= 11.15, newer than the npm bundled with
#   Node 24, so the workflow installs a pinned npm first.
#
# Release: bump "version" in package.json on main, then push a matching tag:
#   git tag -a 0.2.0 -m "n8n-nodes-bannx 0.2.0" && git push origin 0.2.0
# Then approve the staged version under npmjs.com → Staged Packages.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint the OIDC token for trusted publishing and provenance.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # isolated-vm (via @n8n/node-cli) does not build on Node 26 yet
          cache: 'npm'

      - name: Install npm with staged publishing
        run: npm install -g npm@11.21.2

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Stage the release
        # RELEASE_MODE satisfies the package's prepublishOnly guard
        # (`n8n-node prerelease`), which blocks publishes made outside a release.
        run: npm stage publish --provenance --access public
        env:
          RELEASE_MODE: 'true'
